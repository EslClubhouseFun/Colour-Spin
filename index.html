*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 12% 18%,rgba(255,214,10,.35) 0 60px,transparent 61px),
    radial-gradient(circle at 88% 82%,rgba(47,128,237,.18) 0 90px,transparent 91px),
    radial-gradient(circle at 92% 12%,rgba(60,200,90,.2) 0 40px,transparent 41px),
    radial-gradient(circle at 6% 88%,rgba(155,81,224,.18) 0 50px,transparent 51px),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}
.app{
  height:100%;width:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);
  align-items:center;gap:2vw;padding:max(2vh,env(safe-area-inset-top)) 3vw max(2vh,env(safe-area-inset-bottom));
}
/* ---------- wheel ---------- */
.wheel-zone{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
.wheel-wrap{position:relative;width:min(86vh,56vw);aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 10px 0 rgba(43,42,76,.18))}
.pointer{
  position:absolute;left:50%;top:-3.2%;width:12%;transform:translateX(-50%);transform-origin:50% 25%;
  z-index:3;filter:drop-shadow(0 4px 0 rgba(43,42,76,.25));
}
.pointer.tick{animation:tick .12s ease-out}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}
.hub{
  position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:none;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#FFF1F7 19% 100%);
  box-shadow:0 0 0 6px var(--ink),0 6px 0 6px rgba(43,42,76,.25);
  font-family:inherit;font-weight:700;font-size:min(4.2vh,2.6vw);color:var(--accent-dark);letter-spacing:.04em;cursor:pointer;z-index:2;
  transition:transform .12s;
}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.hub:disabled{color:#bbb;cursor:default}

/* ---------- mascot (Dotty the paint drop) ---------- */
.mascot{position:relative;--mc:#FF7EB6}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.m-body,.m-hand{fill:var(--mc)}
.mascot.rainbow .m-body,.mascot.rainbow .m-hand{fill:url(#dotRainbow)}
.m-mouth{stroke:#2B2A4C}
.mascot.dark .m-mouth{stroke:#fff}
.mascot.dark .m-cheek{opacity:.9}
.m-open{display:none}
.mascot.happy .m-open,.mascot.counting .m-open{display:inline}
.mascot.happy .m-mouth,.mascot.counting .m-mouth{display:none}
.m-all{transform-origin:70px 146px;animation:bob 2.4s ease-in-out infinite}
.m-eyes{transform-origin:70px 92px;animation:blink 4.2s infinite}
.m-pupils{transition:transform .3s}
.m-arm-l{transform-origin:34px 98px;transition:transform .25s}
.m-arm-r{transform-origin:106px 98px;transition:transform .25s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.98,1.02)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* watching the wheel spin */
.mascot.watch .m-all{animation:wiggle .35s ease-in-out infinite}
.mascot.watch .m-pupils{transform:translate(3px,-4px)}
.mascot.watch .m-arm-l{transform:rotate(60deg)}
.mascot.watch .m-arm-r{transform:rotate(-60deg)}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
/* cheering */
.mascot.happy .m-all{animation:hop .6s cubic-bezier(.3,.7,.4,1) 4}
.mascot.happy .m-arm-l{transform:rotate(110deg)}
.mascot.happy .m-arm-r{transform:rotate(-110deg)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(.95,1.05)}50%{transform:translateY(-26px) scale(.97,1.03)}85%{transform:translateY(0) scale(1.08,.92)}}
/* move beats */
.mascot.beat-jump .m-all{animation:hop .6s cubic-bezier(.3,.7,.4,1) 1}
.mascot.beat-jump .m-arm-l{transform:rotate(110deg)}
.mascot.beat-jump .m-arm-r{transform:rotate(-110deg)}
.mascot.beat-clap .m-arm-l{animation:clapL .45s ease-in-out 1}
.mascot.beat-clap .m-arm-r{animation:clapR .45s ease-in-out 1}
@keyframes clapL{0%,100%{transform:rotate(70deg)}50%{transform:rotate(-8deg)}}
@keyframes clapR{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(8deg)}}
.mascot.counting .m-arm-l{transform:rotate(70deg)}
.mascot.counting .m-arm-r{transform:rotate(-70deg)}
.mascot.beat-spin svg{animation:spinY .75s ease-in-out 1}
.mascot.beat-spin .m-arm-l{transform:rotate(100deg)}
.mascot.beat-spin .m-arm-r{transform:rotate(-100deg)}

.panel{display:flex;flex-direction:column;gap:1.6vh;height:100%;justify-content:center;max-height:100%;overflow:auto;padding:4px 4px 10px}

.card{background:var(--card);border-radius:22px;padding:1.4vh 1.4vw;box-shadow:var(--shadow);border:3px solid var(--ink)}
.card h2{margin:0 0 .6vh;font-size:min(2.4vh,1.5vw);font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.6vh 0;font-size:min(2.8vh,1.75vw);font-weight:500;cursor:pointer}

.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:left .2s}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,42,76,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}

.move-icon::before{content:"";position:absolute;inset:-6px;border-radius:50%;padding:12px;background:var(--rainbow);

@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(8deg)}}

corner.insertAdjacentHTML("afterbegin",MASCOT_SVG);
cardM.insertAdjacentHTML("afterbegin",MASCOT_SVG);
var MOODS=["watch","happy","counting","beat-jump","beat-clap","beat-spin"];
function mood(el,m){MOODS.forEach(function(x){el.classList.remove(x)});if(m){void el.offsetWidth;el.classList.add(m)}}
function paint(el,item){
  el.classList.toggle("rainbow",!!(item&&item.surprise));
  el.classList.toggle("dark",!!(item&&item.dark));
  if(item&&!item.surprise)el.style.setProperty("--mc",item.hex);
}
var bubbleT=null;
function speak(text,ms){
  var b=$("bubble");b.textContent=text;b.classList.add("show");
  clearTimeout(bubbleT);bubbleT=setTimeout(function(){b.classList.remove("show")},ms||2600);
}

/* ---------- wheel data ---------- */
function allColours(){
  var list=[];
  CORE.forEach(function(c){
    list.push(c);
    if(optBonus.checked){BONUS.forEach(function(b){if(b.after===c.name)list.push(b)})}
  });
  return list;
}
function activeItems(){
  var list=allColours().filter(function(c){return !removed[c.name]});
  if(optSurprise.checked&&list.length){
    list.splice(Math.ceil(list.length/2),0,{name:"Surprise!",surprise:true,id:1});
    list.push({name:"Surprise!",surprise:true,id:2});
  }
  return list;
}
function colourCountLeft(){return allColours().filter(function(c){return !removed[c.name]}).length}

/* ---------- drawing ---------- */
var size=0;
var RB=["#EB3B3B","#FF8C1A","#FFD60A","#3CC85A","#2F80ED","#9B51E0"];
function resize(){
  var r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);
  if(!r.width)return;
  size=r.width;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function draw(){
  var cols=activeItems(),n=cols.length,cx=size/2,cy=size/2,R=size/2-8,seg=Math.PI*2/n,Ri=R-6;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath();ctx.arc(cx,cy,R+4,0,Math.PI*2);ctx.fillStyle="#2B2A4C";ctx.fill();
  for(var i=0;i<n;i++){
    var a0=rotation+i*seg,a1=a0+seg;
    if(cols[i].surprise){
      // rainbow bands, outer to inner
      for(var k=0;k<RB.length;k++){
        var ro=Ri-(Ri*0.8)*k/RB.length;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,ro,a0,a1);ctx.closePath();ctx.fillStyle=RB[k];ctx.fill();
      }
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,Ri*0.2,a0,a1);ctx.closePath();ctx.fillStyle="#fff";ctx.fill();
    }else{
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,Ri,a0,a1);ctx.closePath();
      ctx.fillStyle=cols[i].hex;ctx.fill();
      ctx.save();ctx.clip();
      ctx.beginPath();ctx.arc(cx,cy,Ri,a0,a1);ctx.arc(cx,cy,Ri*0.88,a1,a0,true);ctx.closePath();
      ctx.fillStyle="rgba(255,255,255,.18)";ctx.fill();ctx.restore();
    }
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a0)*Ri,cy+Math.sin(a0)*Ri);
    ctx.strokeStyle="#2B2A4C";ctx.lineWidth=Math.max(3,size*0.007);ctx.stroke();
  }
  var studs=Math.max(n*2,16);
  for(var s=0;s<studs;s++){
    var sa=rotation+s*(Math.PI*2/studs);
    ctx.beginPath();ctx.arc(cx+Math.cos(sa)*(R-1),cy+Math.sin(sa)*(R-1),Math.max(2.5,size*0.009),0,Math.PI*2);
    ctx.fillStyle="#FFF6E0";ctx.fill();
  }
  // labels
  var fs0=Math.max(12,Math.min(size*0.062,size*0.36*seg)),maxW=R*0.54;
  ctx.textBaseline="middle";ctx.lineJoin="round";
  for(var j=0;j<n;j++){
    var it=cols[j];
    if(!optWords.checked&&!it.surprise)continue;
    var text=optWords.checked?it.name:"?";
    var mid=rotation+(j+0.5)*seg;
    var m=((mid%(Math.PI*2))+Math.PI*2)%(Math.PI*2),flip=m>Math.PI/2&&m<Math.PI*1.5;
    var fs=it.surprise&&!optWords.checked?fs0*1.6:fs0;
    ctx.font="700 "+fs+"px Fredoka, system-ui, sans-serif";
    var tw=ctx.measureText(text).width;
    if(tw>maxW){fs=fs*maxW/tw;ctx.font="700 "+fs+"px Fredoka, system-ui, sans-serif";tw=maxW}
    ctx.save();ctx.translate(cx,cy);ctx.rotate(flip?mid+Math.PI:mid);
    var tx=flip?-R*0.86:R*0.86;
    ctx.textAlign=flip?"left":"right";
    ctx.lineWidth=fs*0.26;ctx.strokeStyle="#2B2A4C";ctx.strokeText(text,tx,0);
    ctx.fillStyle="#fff";ctx.fillText(text,tx,0);
    if(it.bonus&&optWords.checked){
      var sr=Math.max(R*0.4,R*0.86-tw-fs*0.55),sx=flip?-sr:sr;
      ctx.textAlign="center";ctx.font="700 "+(fs*0.75)+"px Fredoka, system-ui, sans-serif";
      ctx.strokeText("★",sx,0);ctx.fillStyle="#FFD60A";ctx.fillText("★",sx,0);
    }
    ctx.restore();
  }
  updateCount();
}
function updateCount(){
  var total=allColours().length,left=colourCountLeft(),s=optSurprise.checked?" + 2 surprises":"";
  $("leftCount").textContent=optRemove.checked?(left+" of "+total+" colours left"+s):(total+" colours"+s+" on the wheel");
}

/* ---------- audio ---------- */
var AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();setTimeout(loadClips,0)}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(freq,dur,type,vol,delay){
  if(!optSound.checked)return;var ac=audio();if(!ac)return;
  var t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
}
function tickSound(){tone(1250,0.05,"square",0.06)}
function fanfare(){[523,659,784,1047].forEach(function(f,i){tone(f,0.28,"triangle",0.18,i*0.11)})}
function surpriseSound(){[392,523,659,784,988,1175,1568].forEach(function(f,i){tone(f,0.16,"square",0.07,i*0.06)})}
function beatSound(i){tone(440*Math.pow(2,i/6),0.18,"triangle",0.2)}
var voice=null;
function pickVoice(){
  if(!window.speechSynthesis)return;var vs=speechSynthesis.getVoices();
  voice=vs.find(function(v){return /en-GB/i.test(v.lang)&&/female|samantha|serena|kate|martha/i.test(v.name)})||
        vs.find(function(v){return /^en[-_](US|GB|AU)/i.test(v.lang)})||vs.find(function(v){return /^en/i.test(v.lang)})||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate){
  if(!optSound.checked||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-US";u.rate=rate||0.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}
}
function unlockSpeech(){
  if(window.speechSynthesis&&!unlockSpeech.done){try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}unlockSpeech.done=true}
}

    try{if(window.speechSynthesis)speechSynthesis.cancel();if(clipSrc)clipSrc.stop()}catch(e){}
    var s=ac.createBufferSource(),g=ac.createGain();g.gain.value=1;s.buffer=buf;s.connect(g);g.connect(ac.destination);s.start();clipSrc=s;
  }else say(name+"!");   // fallback if a clip is missing
}

/* ---------- spin ---------- */
function indexAtPointer(rot,n){
  var seg=Math.PI*2/n,a=(-Math.PI/2-rot)%(Math.PI*2);if(a<0)a+=Math.PI*2;return Math.floor(a/seg)%n;
}
function spin(){
  if(spinning||$("overlay").classList.contains("show"))return;
  audio();unlockSpeech();
  var cols=activeItems();
  if(!cols.length){resetWheel();return}
  var n=cols.length,seg=Math.PI*2/n,target=Math.floor(Math.random()*n),f=0.15+Math.random()*0.7;
  var desired=-Math.PI/2-(target+f)*seg;
  var cur=rotation%(Math.PI*2),d=(desired-cur)%(Math.PI*2);if(d<0)d+=Math.PI*2;
  var turns=5+Math.floor(Math.random()*3);
  var start=rotation,end=rotation+d+turns*Math.PI*2,dur=4200+Math.random()*1000,t0=null;
  spinning=true;setButtons();lastBoundary=Math.floor(((-Math.PI/2-rotation)/seg));
  mood(corner,"watch");speak(pick(SPIN_LINES),2200);
  function ease(t){return 1-Math.pow(1-t,4)}
  function frame(ts){
    if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur);
    rotation=start+(end-start)*ease(p);draw();
    var b=Math.floor(((-Math.PI/2-rotation)/seg));
    if(b!==lastBoundary){lastBoundary=b;tickSound();var pt=$("pointer");pt.classList.remove("tick");void pt.offsetWidth;pt.classList.add("tick")}
    if(p<1)requestAnimationFrame(frame);else{rotation=end%(Math.PI*2);spinning=false;land(cols[indexAtPointer(rotation,n)])}
  }
  requestAnimationFrame(frame);
}
var current=null,currentMove=null,counting=false;
function land(c){
  current=c;draw();
  history.push(c);renderHistory();
  paint(corner,c);paint(cardM,c);
  mood(corner,"happy");
  if(c.surprise){showMove();}else{showColour(c);}
  setButtons();
}
function showColour(c){
  var r=$("result");r.classList.remove("move");
  $("blob").style.background=c.hex;
  var w=$("word");w.textContent=c.name;w.style.color=c.hex;
  $("prompt").textContent=pick(PROMPTS).replace("{c}",c.name.toLowerCase());
  $("overlay").classList.add("show");
  mood(cardM,"happy");
  fanfare();confetti(c.hex);
  speak(pick(CHEERS)+" "+c.name+"!",3000);
  later(function(){sayColour(c.name)},350);
}
function showMove(){
  var r=$("result");r.classList.add("move");
  var mv=pick(MOVES),cnt=mv.min+Math.floor(Math.random()*(mv.max-mv.min+1));
  currentMove={mv:mv,n:cnt};counting=false;
  var w=$("word"),icon=$("moveIcon"),emo=$("moveEmo");
  w.style.color="#FF8C1A";w.innerHTML="Surprise!";
  $("prompt").textContent="What will it be?";
  $("tiles").innerHTML="";$("tiles").classList.remove("done");
  $("goBtn").disabled=true;$("againBtn").disabled=true;
  icon.classList.add("shuffle");
  $("overlay").classList.add("show");
  mood(cardM,"watch");
  surpriseSound();speak("Surprise!",2600);
  // shuffle through the moves, then reveal
  var steps=0;
  (function shuffle(){
    emo.textContent=MOVES[steps%MOVES.length].emoji;tone(700+steps*40,.06,"square",.06);steps++;
    if(steps<10)later(shuffle,110);else reveal();
  })();
  function reveal(){
    icon.classList.remove("shuffle");emo.textContent=mv.emoji;
    w.innerHTML=mv.label+'<span class="times">×'+cnt+'</span>';
    $("prompt").textContent=mv.verb+" "+cnt+" time"+(cnt>1?"s":"")+"!";
    var t=$("tiles");
    for(var i=1;i<=cnt;i++){var d=document.createElement("div");d.className="tile";d.textContent=i;t.appendChild(d)}
    mood(cardM,"happy");fanfare();confetti("#FFD60A");
    $("goBtn").disabled=false;$("againBtn").disabled=false;
    later(function(){say(mv.verb+" "+NUMS[cnt]+" time"+(cnt>1?"s":"")+"!")},300);
  }
}
function runCount(){
  if(!currentMove||counting)return;
  counting=true;audio();
  var mv=currentMove.mv,cnt=currentMove.n,tiles=$("tiles").children;
  for(var i=0;i<tiles.length;i++){tiles[i].classList.remove("lit");tiles[i].style.background=""}
  $("tiles").classList.remove("done");
  $("goBtn").disabled=true;$("againBtn").disabled=true;
  mood(cardM,"counting");
  say("Ready? Go!",0.95);
  var gap=mv.key==="spin"?1500:1050,i0=0;
  later(function step(){
    var tile=tiles[i0];tile.classList.add("lit");tile.style.background=RB[i0%RB.length];
    mood(cardM,"beat-"+mv.key);cardM.classList.add("counting");
    beatSound(i0);say(NUMS[i0+1]+"!",1);
    i0++;
    if(i0<cnt)later(step,gap);
    else later(function(){
      counting=false;mood(cardM,"happy");$("tiles").classList.add("done");
      $("prompt").textContent="Great job!";fanfare();confetti("#3CC85A");say("Great job!");
      $("goBtn").disabled=false;$("goBtn").textContent="↻ Again";$("againBtn").disabled=false;
    },gap*0.9);
  },1100);
}
function closeResult(){
  clearTimers();counting=false;
  $("overlay").classList.remove("show");
  $("goBtn").textContent="▶ Let's go!";$("goBtn").disabled=false;$("againBtn").disabled=false;
  $("moveIcon").classList.remove("shuffle");
  if(current&&!current.surprise&&optRemove.checked){
    removed[current.name]=true;draw();
    if(colourCountLeft()===0){toast("All colours done! Wheel is full again.");removed={};setTimeout(draw,300)}
  }
  mood(corner,null);
  if(current)speak("Spin again!",2000);
  current=null;currentMove=null;setButtons();
}
function renderHistory(){
  var h=$("history");h.innerHTML="";
  if(!history.length){h.innerHTML='<span class="empty">No spins yet</span>';return}
  history.slice(-12).forEach(function(c){var i=document.createElement("i");if(c.surprise){i.className="rb";i.title="Surprise!"}else{i.style.background=c.hex;i.title=c.name}h.appendChild(i)});
}
function resetWheel(){removed={};history=[];renderHistory();draw();toast("Wheel reset!")}
function setButtons(){$("spinBtn").disabled=spinning;$("hub").disabled=spinning}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2200)}

/* ---------- big screen ---------- */
function setBig(on){
  document.body.classList.toggle("big",on);
  var el=document.documentElement;
  try{
    if(on){var rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){var p=rq.call(el);if(p&&p.catch)p.catch(function(){})}}
    else if(document.fullscreenElement||document.webkitFullscreenElement){var ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex){var q=ex.call(document);if(q&&q.catch)q.catch(function(){})}}
  }catch(e){}
  updateSoundIcon();
  setTimeout(resize,60);setTimeout(resize,400);
}
function updateSoundIcon(){$("bigSound").textContent=optSound.checked?"🔊":"🔇"}
$("bigBtn").addEventListener("click",function(){setBig(true)});
$("bigExit").addEventListener("click",function(){setBig(false)});
$("bigSound").addEventListener("click",function(){optSound.checked=!optSound.checked;updateSoundIcon();if(!optSound.checked&&window.speechSynthesis)speechSynthesis.cancel()});

/* ---------- confetti ---------- */
var cf=$("confetti"),cctx=cf.getContext("2d"),bits=[],cfRun=false;
function sizeConfetti(){cf.width=innerWidth;cf.height=innerHeight}
function confetti(main){
  sizeConfetti();var pal=[main,main,main,"#FFD60A","#FF7EB6","#2F80ED","#3CC85A","#9B51E0","#FF8C1A"];
  for(var i=0;i<110;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.42,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:8+Math.random()*8,h:6+Math.random()*6,c:pal[i%pal.length],life:0});
  if(!cfRun){cfRun=true;requestAnimationFrame(stepConfetti)}
}
function stepConfetti(){
  cctx.clearRect(0,0,cf.width,cf.height);
  bits=bits.filter(function(b){return b.y<cf.height+40&&b.life<240});
  bits.forEach(function(b){b.vy+=0.45;b.vx*=0.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life++;
    cctx.save();cctx.translate(b.x,b.y);cctx.rotate(b.r);cctx.fillStyle=b.c;cctx.strokeStyle="rgba(43,42,76,.5)";cctx.lineWidth=1.5;
    cctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);cctx.restore()});
  if(bits.length)requestAnimationFrame(stepConfetti);else{cfRun=false;cctx.clearRect(0,0,cf.width,cf.height)}
}

/* ---------- events ---------- */
$("spinBtn").addEventListener("click",spin);
$("hub").addEventListener("click",spin);
canvas.addEventListener("click",spin);
$("againBtn").addEventListener("click",function(){closeResult();setTimeout(spin,250)});
$("sayBtn").addEventListener("click",function(){if(current&&!current.surprise)sayColour(current.name)});
$("goBtn").addEventListener("click",runCount);
$("overlay").addEventListener("click",function(e){if(e.target===this&&!counting)closeResult()});
$("resetBtn").addEventListener("click",resetWheel);
[optBonus,optWords,optSurprise].forEach(function(o){o.addEventListener("change",function(){if(!spinning)draw();else o.checked=!o.checked})});
optRemove.addEventListener("change",function(){if(!optRemove.checked)removed={};draw()});
optBonus.addEventListener("change",function(){if(!spinning)toast(optBonus.checked?"★ Bonus colours added!":"Bonus colours taken off")});
optSurprise.addEventListener("change",function(){if(!spinning)toast(optSurprise.checked?"🎉 Surprise moves added!":"Surprise moves taken off")});
optSound.addEventListener("change",updateSoundIcon);
window.addEventListener("resize",resize);
document.addEventListener("fullscreenchange",function(){setTimeout(resize,100)});
document.addEventListener("keydown",function(e){
  var open=$("overlay").classList.contains("show");
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault();if(open){if(!counting)closeResult()}else spin()}
  else if(e.key==="b"||e.key==="B"){setBig(!document.body.classList.contains("big"))}
  else if(e.key==="Escape"&&document.body.classList.contains("big")){setBig(false)}
});
document.addEventListener("pointerdown",function first(){audio();unlockSpeech();document.removeEventListener("pointerdown",first)});
document.addEventListener("gesturestart",function(e){e.preventDefault()});

if(document.fonts&&document.fonts.load){document.fonts.load('700 20px "Fredoka"').then(resize,resize)}else resize();
resize();
setTimeout(function(){speak("Hi! Spin the wheel!",3200)},700);
window.__test={clips:function(){return Object.keys(clipBuf).sort().join(",")+"|"+Object.keys(clipBuf).map(function(k){return clipBuf[k].duration.toFixed(2)}).join(",")},check:function(){var c=activeItems();return c[indexAtPointer(rotation,c.length)].name},
  forceLand:function(surprise){var c=activeItems().filter(function(x){return !!x.surprise===!!surprise})[0];land(c)}};
})();
</script>
